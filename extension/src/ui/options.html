<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extract Chords</title>
<script>
  const isWebKit = window.webkit?.messageHandlers?.live;
  const isWebView2 = window.chrome?.webview;
  function sendMessage(message) {
    if (isWebKit) window.webkit.messageHandlers.live.postMessage(message);
    else if (isWebView2) window.chrome.webview.postMessage(message);
  }
  function closeWithResult(result) {
    sendMessage({ method: "close_and_send", params: [JSON.stringify(result)] });
  }
  window.__DATA__ = /*__HYPERCHORD_DATA__*/ null;
</script>
<style>
  :root { --panel: #4E4E4E; --accent: #FFA500; --text: #FFFFFF; --muted: #B8B8B8; --border: #2C2C2C; --input: #2C2C2C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--panel); color: var(--text); font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .sub { color: var(--muted); margin-top: 2px; }
  main { flex: 1; overflow: auto; padding: 10px 16px; }
  .row { display: grid; grid-template-columns: 1fr 190px; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row[hidden] { display: none; }
  label { font-weight: 500; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  select { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 5px 6px; font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); justify-self: start; }
  footer { padding: 10px 16px 12px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }
  button { border: none; padding: 7px 16px; cursor: pointer; border-radius: 3px; font-weight: 600; font: inherit; }
  button.primary { background: var(--accent); color: #000; }
  button.secondary { background: var(--input); color: var(--text); }
</style>
</head>
<body>
<header><h1 id="title">Extract Chords</h1><div class="sub" id="subtitle"></div></header>
<main>
  <div class="row" id="rowOnset">
    <div><label for="onset">Strum / arpeggio window</label><div class="hint">Notes starting within this span count as one chord.</div></div>
    <select id="onset"></select>
  </div>
  <div class="row">
    <div><label for="minLen">Minimum chord length</label><div class="hint">Shorter chords are folded into a neighbour.</div></div>
    <select id="minLen"></select>
  </div>
  <div class="row">
    <div><label for="snap">Snap boundaries to</label><div class="hint">Chord changes are moved onto this grid.</div></div>
    <select id="snap"></select>
  </div>
  <div class="row" id="rowInv">
    <div><label for="inv">Slash chords from the bass note</label><div class="hint">Turn off for guitar-style voicings (5th at the bottom).</div></div>
    <input type="checkbox" id="inv">
  </div>
  <div class="row" id="rowSimp">
    <div><label for="simp">Simplify extensions</label><div class="hint">Badd9 → B, C#9 → C#7, B13 → B7.</div></div>
    <input type="checkbox" id="simp">
  </div>
  <div class="row">
    <div><label for="roman">Function in clip names</label><div class="hint">Amaj7 (VImaj7)</div></div>
    <input type="checkbox" id="roman">
  </div>
</main>
<footer>
  <button class="secondary" onclick="closeWithResult({ cancelled: true })">Cancel</button>
  <button class="primary" id="go">Extract</button>
</footer>
<script>
  const d = window.__DATA__ || {};
  const v = d.values || {};
  document.getElementById("title").textContent = d.title || "Extract Chords";
  document.getElementById("subtitle").textContent = d.subtitle || "";
  const NOTE_CHOICES = [
    [0.0625, "1/64 note"], [0.125, "1/32 note"], [0.25, "1/16 note"], [0.5, "1/8 note"],
    [1, "1/4 note (1 beat)"], [2, "1/2 note (2 beats)"], [4, "1 bar (4 beats)"],
  ];
  function fill(id, choices, value, allowOff) {
    const sel = document.getElementById(id);
    if (allowOff) sel.add(new Option("Off", "0"));
    for (const [val, label] of choices) sel.add(new Option(label, String(val)));
    let best = null;
    for (const o of sel.options) if (best === null || Math.abs(Number(o.value) - value) < Math.abs(Number(best.value) - value)) best = o;
    if (best) best.selected = true;
  }
  fill("onset", NOTE_CHOICES.slice(0, 6), v.onsetTolerance ?? 0.25, false);
  fill("minLen", NOTE_CHOICES.slice(1), v.minSegmentBeats ?? 0.5, false);
  fill("snap", NOTE_CHOICES.slice(1, 5), v.snapBeats ?? 0.25, true);
  document.getElementById("inv").checked = v.midiInversions !== false;
  document.getElementById("simp").checked = !!v.simplifyExtensions;
  document.getElementById("roman").checked = v.romanInClipName !== false;
  if (d.source === "audio") {
    document.getElementById("rowOnset").hidden = true;
    document.getElementById("rowInv").hidden = true;
    document.getElementById("rowSimp").hidden = true;
  }
  document.getElementById("go").onclick = () => closeWithResult({
    onsetTolerance: Number(document.getElementById("onset").value),
    minSegmentBeats: Number(document.getElementById("minLen").value),
    snapBeats: Number(document.getElementById("snap").value),
    midiInversions: document.getElementById("inv").checked,
    simplifyExtensions: document.getElementById("simp").checked,
    romanInClipName: document.getElementById("roman").checked,
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("go").click();
    if (e.key === "Escape") closeWithResult({ cancelled: true });
  });
</script>
</body>
</html>
